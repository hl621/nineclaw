[project]
name = "nineclaw-websearch"
version = "0.1.0"
description = "Tavily-like search & extract service with configurable search sources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.13.0",
    "asyncpg==0.29.0",
    "fastapi==0.104.1",
    "httpx==0.25.2",
    "pydantic-settings==2.1.0",
    "psycopg2-binary==2.9.9",
    "sqlalchemy>=2.0.49",
    "sqlmodel==0.0.14",
    "uvicorn[standard]==0.24.0",
    "lxml>=5.0.0",
    "dateparser>=1.2.0",
    "html5lib>=1.1",
    "w3lib>=2.1.2",
    "gne>=0.3.0",
    "loguru>=0.7.0",
    "agno>=1.0.0",
    "parsel>=1.9.0",
    "openai>=1.0.0",
    "sse-starlette>=2.1.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true
