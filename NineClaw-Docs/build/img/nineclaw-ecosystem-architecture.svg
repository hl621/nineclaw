<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">NineClaw 生态架构图</title>
  <desc id="desc">NineClaw 生态架构分层图。Traefik 是统一入口，挂载 WebUI、Docs 和 Runtime；WebUI 调用 Manager；Manager 管理 Runtime 并适配 QY-RAG 和 WebSearch；Deploy 位于独立交付层。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .page { fill: #f8fafc; }
      .layer { fill: #ffffff; stroke: #d8e2ec; stroke-width: 2; rx: 24; ry: 24; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 34px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #64748b; }
      .layer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 750; fill: #475569; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 21px; font-weight: 760; fill: #0f172a; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; fill: #475569; }
      .caption { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #334155; }
      .legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; fill: #64748b; }
      .box { stroke-width: 2; rx: 18; ry: 18; }
      .user { fill: #eef2ff; stroke: #4f46e5; }
      .traefik { fill: #eff6ff; stroke: #2563eb; }
      .webui { fill: #ecfeff; stroke: #0891b2; }
      .docs { fill: #f1f5f9; stroke: #64748b; }
      .runtime { fill: #fff7ed; stroke: #ea580c; }
      .manager { fill: #f0fdf4; stroke: #16a34a; }
      .rag { fill: #faf5ff; stroke: #9333ea; }
      .search { fill: #f0fdfa; stroke: #0f766e; }
      .deploy { fill: #fff1f2; stroke: #e11d48; }
      .route { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .call { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .route-soft { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); opacity: 0.85; }
      .call-soft { stroke: #16a34a; stroke-width: 2.5; fill: none; marker-end: url(#arrow-green); opacity: 0.85; }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; ry: 12; }
    </style>
  </defs>

  <rect class="page" width="1200" height="960"/>

  <text class="title" x="60" y="62">NineClaw 生态架构</text>
  <text class="subtitle" x="60" y="94">Traefik 负责统一入口和挂载访问；Manager 负责管理、适配和业务控制；Deploy 独立负责交付部署。</text>

  <rect class="layer" x="44" y="122" width="1112" height="152"/>
  <text class="layer-title" x="74" y="160">统一访问入口</text>

  <rect class="box user" x="150" y="186" width="190" height="58"/>
  <text class="box-title" x="213" y="222">用户</text>

  <rect class="box traefik" x="500" y="174" width="260" height="82"/>
  <text class="box-title" x="579" y="207">Traefik</text>
  <text class="box-sub" x="554" y="233">统一入口 / 路由转发</text>

  <path class="route" d="M340 215 H500"/>
  <rect class="pill" x="392" y="191" width="68" height="25"/>
  <text class="caption" x="409" y="209">访问</text>

  <rect class="layer" x="44" y="304" width="1112" height="184"/>
  <text class="layer-title" x="74" y="342">Traefik 挂载的应用与实例</text>

  <rect class="box webui" x="100" y="382" width="280" height="78"/>
  <text class="box-title" x="154" y="414">NineClaw-WebUI</text>
  <text class="box-sub" x="145" y="440">统一前端 / 左侧导航</text>

  <rect class="box docs" x="460" y="382" width="280" height="78"/>
  <text class="box-title" x="514" y="414">NineClaw-Docs</text>
  <text class="box-sub" x="515" y="440">文档站点 / API 文档</text>

  <rect class="box runtime" x="820" y="382" width="280" height="78"/>
  <text class="box-title" x="864" y="414">NineClaw-Runtime</text>
  <text class="box-sub" x="857" y="440">实例运行时 / Hermes 改造</text>

  <path class="route-soft" d="M600 256 V314 C600 344 265 344 240 382"/>
  <path class="route-soft" d="M630 256 V382"/>
  <path class="route-soft" d="M660 256 V314 C660 344 934 344 960 382"/>

  <rect class="pill" x="202" y="330" width="96" height="25"/>
  <text class="caption" x="218" y="348">路由前端</text>
  <rect class="pill" x="552" y="330" width="96" height="25"/>
  <text class="caption" x="568" y="348">路由文档</text>
  <rect class="pill" x="912" y="330" width="96" height="25"/>
  <text class="caption" x="928" y="348">挂载实例</text>

  <rect class="layer" x="44" y="518" width="1112" height="266"/>
  <text class="layer-title" x="74" y="556">业务管理与能力服务</text>

  <rect class="box manager" x="100" y="608" width="330" height="88"/>
  <text class="box-title" x="174" y="642">NineClaw-Manager</text>
  <text class="box-sub" x="142" y="670">实例生命周期 / 路由配置 / BFF 适配</text>

  <rect class="box rag" x="570" y="568" width="250" height="72"/>
  <text class="box-title" x="649" y="598">QY-RAG</text>
  <text class="box-sub" x="615" y="621">知识库 / 切片 / 召回 / 问答</text>

  <rect class="box search" x="570" y="656" width="250" height="72"/>
  <text class="box-title" x="601" y="686">NineClaw-WebSearch</text>
  <text class="box-sub" x="619" y="709">聚合搜索 / 网页内容提取</text>

  <path class="call" d="M240 460 V608"/>
  <rect class="pill" x="264" y="548" width="112" height="25"/>
  <text class="caption" x="283" y="566">业务 API</text>

  <path class="call-soft" d="M430 640 H570"/>
  <path class="call-soft" d="M430 674 C490 674 505 692 570 692"/>

  <path class="call-soft" d="M365 608 C505 535 785 535 916 460"/>
  <rect class="pill" x="672" y="504" width="124" height="25"/>
  <text class="caption" x="690" y="522">管理 Runtime</text>

  <text class="legend" x="82" y="760">蓝色线：Traefik 访问路由和服务挂载</text>
  <text class="legend" x="396" y="760">绿色线：WebUI/Manager 业务调用、管理和适配</text>

  <rect class="layer" x="44" y="816" width="1112" height="104"/>
  <text class="layer-title" x="74" y="855">独立交付层</text>

  <rect class="box deploy" x="328" y="846" width="544" height="58"/>
  <text class="box-title" x="506" y="874">NineClaw-Deploy</text>
  <text class="box-sub" x="444" y="895">集成打包 / 镜像导出 / 离线部署 / 服务更新</text>
</svg>
