<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">NineClaw Web Source Management Flow</title>
  <desc id="desc">Architecture diagram for NineClaw web source management, showing configuration management in Manager and concurrent search execution in WebSearch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4f8"/>
    </linearGradient>
    <linearGradient id="manager" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7f1ff"/>
      <stop offset="100%" stop-color="#d8e9ff"/>
    </linearGradient>
    <linearGradient id="websearch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9f8f1"/>
      <stop offset="100%" stop-color="#d5f0e4"/>
    </linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3df"/>
      <stop offset="100%" stop-color="#ffe3b5"/>
    </linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fde7c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#1c2a39" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#426077"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#23705a"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #152536; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b6f82; }
      .section { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1c3347; }
      .label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1c3347; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536879; }
      .tiny { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #607484; }
      .box { rx: 14; stroke-width: 1.2; filter: url(#shadow); }
      .panel { rx: 18; fill: rgba(255,255,255,0.78); stroke: #d8e2ea; stroke-width: 1.2; }
      .line { fill: none; stroke: #426077; stroke-width: 2.2; marker-end: url(#arrow); }
      .line-green { fill: none; stroke: #23705a; stroke-width: 2.2; marker-end: url(#arrowGreen); }
      .dash { fill: none; stroke: #7a8b9a; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>

  <text x="64" y="58" class="title">信源管理：把离线信息系统接入 Hermes WebSearch 能力</text>
  <text x="64" y="86" class="subtitle">Manager 管配置与调试，WebSearch 管并发搜索与抽取，Runtime 以工具形式使用统一结果。</text>

  <rect x="54" y="122" width="520" height="278" class="panel"/>
  <text x="82" y="158" class="section">配置管理面</text>
  <text x="82" y="181" class="small">面向用户、租户和信源生命周期</text>

  <rect x="88" y="216" width="164" height="76" fill="#ffffff" stroke="#ccdceb" class="box"/>
  <text x="119" y="247" class="label">NineClaw-WebUI</text>
  <text x="111" y="271" class="small">创建、调试、验证信源</text>

  <rect x="332" y="200" width="202" height="108" fill="url(#manager)" stroke="#b8d1ee" class="box"/>
  <text x="383" y="232" class="label">NineClaw-Manager</text>
  <text x="361" y="257" class="small">CRUD / 代理请求</text>
  <text x="361" y="279" class="small">AI 生成与 Agent 修复提取器</text>

  <rect x="194" y="332" width="214" height="48" fill="#f6f9fc" stroke="#cbd7e2" rx="12"/>
  <text x="230" y="362" class="small">租户级 web_sources 配置</text>

  <path d="M252 254 C278 254 299 254 326 254" class="line"/>
  <path d="M433 309 C426 329 399 345 408 356" class="line"/>

  <rect x="706" y="122" width="520" height="278" class="panel"/>
  <text x="734" y="158" class="section">搜索执行面</text>
  <text x="734" y="181" class="small">面向并发搜索、抽取、融合排序和故障隔离</text>

  <rect x="746" y="211" width="214" height="116" fill="url(#websearch)" stroke="#addac9" class="box"/>
  <text x="792" y="243" class="label">NineClaw-WebSearch</text>
  <text x="778" y="268" class="small">/v1/search 多信源并发</text>
  <text x="778" y="290" class="small">/v1/extract_detail 正文抽取</text>
  <text x="778" y="312" class="small">/v1/extract_listlink 链接发现</text>

  <rect x="1010" y="181" width="166" height="58" fill="url(#source)" stroke="#edca98" rx="13"/>
  <text x="1055" y="205" class="label">内网搜索</text>
  <text x="1044" y="225" class="small">企业搜索入口</text>

  <rect x="1010" y="255" width="166" height="58" fill="url(#source)" stroke="#edca98" rx="13"/>
  <text x="1055" y="279" class="label">文档门户</text>
  <text x="1037" y="299" class="small">Wiki / 制度 / 手册</text>

  <rect x="1010" y="329" width="166" height="58" fill="url(#source)" stroke="#edca98" rx="13"/>
  <text x="1055" y="353" class="label">业务系统</text>
  <text x="1042" y="373" class="small">工单 / 项目 / 资产</text>

  <path d="M960 247 C980 232 988 217 1005 211" class="line-green"/>
  <path d="M960 270 C981 274 987 280 1005 284" class="line-green"/>
  <path d="M960 298 C981 322 988 345 1005 358" class="line-green"/>

  <path d="M534 254 C604 254 662 254 739 254" class="dash"/>
  <text x="590" y="238" class="tiny">同步配置 / 调用搜索服务</text>

  <rect x="70" y="474" width="1140" height="198" class="panel"/>
  <text x="98" y="510" class="section">Agent 使用链路</text>

  <rect x="108" y="546" width="178" height="78" fill="#ffffff" stroke="#d4dde6" class="box"/>
  <text x="149" y="576" class="label">用户问题</text>
  <text x="136" y="600" class="small">需要检索内部信息</text>

  <rect x="342" y="533" width="218" height="104" fill="url(#runtime)" stroke="#ecc780" class="box"/>
  <text x="398" y="566" class="label">NineClaw-Runtime</text>
  <text x="375" y="591" class="small">Hermes Agent 调用工具</text>
  <text x="366" y="613" class="small">web_search provider / 插件</text>

  <rect x="626" y="533" width="210" height="104" fill="#f2fbf7" stroke="#b7decf" class="box"/>
  <text x="668" y="566" class="label">统一 WebSearch</text>
  <text x="663" y="591" class="small">搜索、抽取、列表发现</text>
  <text x="672" y="613" class="small">去重、融合、排序</text>

  <rect x="904" y="546" width="246" height="78" fill="#ffffff" stroke="#d4dde6" class="box"/>
  <text x="973" y="576" class="label">证据汇聚</text>
  <text x="947" y="600" class="small">返回可引用的搜索结果与正文</text>

  <path d="M286 585 C306 585 318 585 337 585" class="line"/>
  <path d="M560 585 C582 585 600 585 621 585" class="line"/>
  <path d="M836 585 C861 585 878 585 899 585" class="line"/>

  <path d="M731 533 C750 472 770 410 819 334" class="line-green"/>
  <text x="742" y="458" class="tiny">容器网络调用 WebSearch</text>

  <rect x="214" y="698" width="852" height="34" fill="#eaf1f7" stroke="#cfdae4" rx="17"/>
  <text x="302" y="721" class="small">设计目标：离线环境仍保留搜索型智能，把分散内部系统变成 Agent 可用的统一信息入口。</text>
</svg>
