<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-labelledby="title desc">
  <title id="title">NineClaw 知识库问答流程</title>
  <desc id="desc">展示 NineClaw 如何使用 QY-RAG 召回与重排能力，并在外层组织 Agentic RAG 风格的查询、充分上下文判断和回答生成。</desc>
  <defs>
    <marker id="arrow-kqa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-kqa-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#0f766e"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.5}
      .blue{fill:#eff6ff;stroke:#bfdbfe}
      .green{fill:#ecfdf5;stroke:#bbf7d0}
      .teal{fill:#f0fdfa;stroke:#99f6e4}
      .amber{fill:#fffbeb;stroke:#fde68a}
      .rose{fill:#fff1f2;stroke:#fecdd3}
      .node{stroke-width:1.6}
      .text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#111827}
      .title{font-size:24px;font-weight:700}
      .subtitle{font-size:14px;fill:#475569}
      .head{font-size:15px;font-weight:700}
      .label{font-size:14px;font-weight:700}
      .small{font-size:12.5px;fill:#475569}
      .tiny{font-size:11.5px;fill:#64748b}
      .line{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#arrow-kqa)}
      .greenLine{stroke:#0f766e;stroke-width:2.5;fill:none;marker-end:url(#arrow-kqa-green)}
      .dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow-kqa)}
    </style>
  </defs>

  <rect class="bg" width="980" height="640" rx="22"/>
  <text class="text title" x="34" y="42">知识库问答：QY-RAG 检索 + NineClaw Agentic 查询组织</text>
  <text class="text subtitle" x="34" y="66">QY-RAG 提供召回与重排，NineClaw 负责查询改写、证据判断、迭代检索和带引用回答。</text>

  <rect class="panel" x="34" y="104" width="160" height="380" rx="14"/>
  <text class="text head" x="114" y="132" text-anchor="middle">WebUI</text>
  <rect class="node blue" x="58" y="178" width="112" height="74" rx="10"/>
  <text class="text label" x="114" y="205" text-anchor="middle">提交问题</text>
  <text class="text small" x="114" y="226" text-anchor="middle">问题 / 知识库</text>
  <text class="text small" x="114" y="242" text-anchor="middle">模型参数</text>
  <rect class="node blue" x="58" y="338" width="112" height="74" rx="10"/>
  <text class="text label" x="114" y="365" text-anchor="middle">展示回答</text>
  <text class="text small" x="114" y="386" text-anchor="middle">references</text>
  <text class="text small" x="114" y="402" text-anchor="middle">SSE content</text>

  <rect class="panel" x="232" y="104" width="216" height="380" rx="14"/>
  <text class="text head" x="340" y="132" text-anchor="middle">NineClaw 外层编排</text>
  <rect class="node green" x="258" y="154" width="164" height="72" rx="10"/>
  <text class="text label" x="340" y="181" text-anchor="middle">规划与改写</text>
  <text class="text small" x="340" y="202" text-anchor="middle">拆问题 / 改查询</text>
  <text class="text small" x="340" y="218" text-anchor="middle">选择知识库范围</text>
  <rect class="node green" x="258" y="274" width="164" height="82" rx="10"/>
  <text class="text label" x="340" y="301" text-anchor="middle">充分上下文判断</text>
  <text class="text small" x="340" y="322" text-anchor="middle">证据覆盖度</text>
  <text class="text small" x="340" y="338" text-anchor="middle">缺口反馈 / 继续查</text>
  <rect class="node green" x="258" y="398" width="164" height="56" rx="10"/>
  <text class="text label" x="340" y="425" text-anchor="middle">合成回答策略</text>
  <text class="text small" x="340" y="444" text-anchor="middle">引用约束 / 不编造</text>

  <rect class="panel" x="486" y="104" width="190" height="380" rx="14"/>
  <text class="text head" x="581" y="132" text-anchor="middle">QY-RAG</text>
  <rect class="node amber" x="512" y="178" width="138" height="74" rx="10"/>
  <text class="text label" x="581" y="205" text-anchor="middle">召回</text>
  <text class="text small" x="581" y="226" text-anchor="middle">dataset / document</text>
  <text class="text small" x="581" y="242" text-anchor="middle">chunks</text>
  <rect class="node amber" x="512" y="318" width="138" height="74" rx="10"/>
  <text class="text label" x="581" y="345" text-anchor="middle">重排与过滤</text>
  <text class="text small" x="581" y="366" text-anchor="middle">similarity / rerank</text>
  <text class="text small" x="581" y="382" text-anchor="middle">可用切片</text>

  <rect class="panel" x="714" y="104" width="232" height="380" rx="14"/>
  <text class="text head" x="830" y="132" text-anchor="middle">问答模型</text>
  <rect class="node rose" x="742" y="196" width="176" height="82" rx="10"/>
  <text class="text label" x="830" y="223" text-anchor="middle">基于证据回答</text>
  <text class="text small" x="830" y="244" text-anchor="middle">references + question</text>
  <text class="text small" x="830" y="260" text-anchor="middle">中文流式输出</text>
  <rect class="node rose" x="742" y="342" width="176" height="74" rx="10"/>
  <text class="text label" x="830" y="369" text-anchor="middle">引用与审查</text>
  <text class="text small" x="830" y="390" text-anchor="middle">[1] [2] 标注来源</text>
  <text class="text small" x="830" y="406" text-anchor="middle">资料不足则说明</text>

  <path class="line" d="M170 215 H258"/>
  <path class="line" d="M422 190 H512"/>
  <path class="line" d="M581 252 V318"/>
  <path class="line" d="M650 355 H742"/>
  <path class="line" d="M830 278 V342"/>
  <path class="dash" d="M512 355 C462 356 430 338 422 315"/>
  <text class="text tiny" x="462" y="346" text-anchor="middle">证据不足则迭代</text>
  <path class="greenLine" d="M422 426 C520 486 654 486 742 379"/>
  <path class="dash" d="M742 379 C596 542 296 530 170 375"/>

  <rect class="panel" x="34" y="522" width="912" height="70" rx="12"/>
  <text class="text small" x="58" y="548">边界：NineClaw 使用 QY-RAG 的召回与重排能力，不把 QY-RAG 当成完整问答黑盒。</text>
  <text class="text small" x="58" y="570">优化：借鉴 Agentic RAG 的规划、查询改写、fanout、充分上下文判断和迭代检索，让回答更可追踪、更可靠。</text>
</svg>
