<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title desc">
  <title id="title">NineClaw 系统架构图</title>
  <desc id="desc">展示 NineClaw 部署后的宿主机端口、Traefik 路径、容器端口和路径对应关系。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#16a34a"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d8e2ec;stroke-width:2}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.8}.host{fill:#eef2ff;stroke:#4f46e5}.traefik{fill:#eff6ff;stroke:#2563eb}.svc{fill:#ecfeff;stroke:#0891b2}.mgr{fill:#f0fdf4;stroke:#16a34a}.rt{fill:#fff7ed;stroke:#ea580c}.infra{fill:#fefce8;stroke:#ca8a04}.build{fill:#f1f5f9;stroke:#64748b}.text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#0f172a}.title{font-size:26px;font-weight:800}.section{font-size:16px;font-weight:750;fill:#475569}.name{font-size:16px;font-weight:750}.small{font-size:12.5px;fill:#475569}.mono{font-family:SFMono-Regular,Consolas,Menlo,monospace;font-size:11.5px;fill:#334155}.line{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#arrow-blue)}.manage{stroke:#16a34a;stroke-width:2.5;fill:none;marker-end:url(#arrow-green)}.note{font-size:12px;fill:#64748b}
    </style>
  </defs>

  <rect class="bg" width="760" height="980"/>
  <text class="text title" x="34" y="44">NineClaw 系统架构</text>
  <text class="text small" x="34" y="68">重点展示端口、路径、容器服务和内部路径对应关系。</text>

  <rect class="panel" x="28" y="92" width="704" height="470" rx="20"/>
  <text class="text section" x="52" y="126">1. 固定服务：host:8510 -> Traefik :80 -> 容器端口</text>

  <rect class="box host" x="54" y="154" width="132" height="64" rx="13"/>
  <text class="text name" x="89" y="181">外部访问</text>
  <text class="mono" x="82" y="203">host:8510</text>

  <rect class="box traefik" x="238" y="146" width="142" height="80" rx="13"/>
  <text class="text name" x="282" y="176">Traefik</text>
  <text class="mono" x="278" y="198">:80 web</text>
  <text class="mono" x="262" y="215">Dashboard :8080</text>

  <path class="line" d="M186 186 H238"/>

  <rect class="box svc" x="452" y="132" width="220" height="54" rx="12"/>
  <text class="text name" x="474" y="154">WebUI</text>
  <text class="mono" x="474" y="174">/ -> nineclaw-webui:80 /</text>
  <path class="line" d="M380 170 H452"/>

  <rect class="box svc" x="452" y="198" width="220" height="54" rx="12"/>
  <text class="text name" x="474" y="220">Docs</text>
  <text class="mono" x="474" y="240">/docs -> docs:3000 /docs</text>
  <path class="line" d="M380 190 C410 190 420 225 452 225"/>

  <rect class="box mgr" x="452" y="264" width="220" height="54" rx="12"/>
  <text class="text name" x="474" y="286">Manager</text>
  <text class="mono" x="474" y="306">/v1 -> manager:8000 /v1</text>
  <path class="line" d="M380 203 C410 203 420 291 452 291"/>

  <rect class="box svc" x="452" y="330" width="220" height="70" rx="12"/>
  <text class="text name" x="474" y="352">WebSearch</text>
  <text class="mono" x="474" y="372">/ws-api/... -> websearch:8000</text>
  <text class="mono" x="474" y="389">内部路径：/v1/...</text>
  <path class="line" d="M309 226 C309 360 408 365 452 365"/>

  <rect class="box svc" x="452" y="412" width="220" height="54" rx="12"/>
  <text class="text name" x="474" y="434">OpenSandbox</text>
  <text class="mono" x="474" y="454">/sandbox -> sandbox:8090</text>
  <path class="line" d="M280 226 C280 436 398 439 452 439"/>

  <rect class="box infra" x="54" y="272" width="132" height="54" rx="12"/>
  <text class="text name" x="79" y="294">PostgreSQL</text>
  <text class="mono" x="72" y="314">15432 -> :5432</text>

  <rect class="box infra" x="54" y="344" width="132" height="54" rx="12"/>
  <text class="text name" x="78" y="366">qiyuan_net</text>
  <text class="small" x="73" y="386">共享 Docker 网络</text>

  <rect class="box infra" x="54" y="416" width="132" height="54" rx="12"/>
  <text class="text name" x="72" y="438">Docker Socket</text>
  <text class="small" x="76" y="458">服务发现/实例控制</text>

  <text class="note" x="52" y="526">固定路由中，/ws-api 对应 WebSearch 内部 /v1；其他固定服务基本保持同名路径。</text>

  <rect class="panel" x="28" y="594" width="704" height="304" rx="20"/>
  <text class="text section" x="52" y="628">2. Runtime 动态服务：Manager 创建容器并写入 Traefik labels</text>

  <rect class="box mgr" x="54" y="664" width="150" height="82" rx="13"/>
  <text class="text name" x="90" y="692">Manager</text>
  <text class="small" x="78" y="714">Docker API 创建</text>
  <text class="small" x="78" y="731">Runtime 容器 + labels</text>

  <rect class="box traefik" x="252" y="664" width="136" height="82" rx="13"/>
  <text class="text name" x="294" y="692">Traefik</text>
  <text class="small" x="278" y="714">Docker Provider</text>
  <text class="small" x="278" y="731">发现实例路由</text>

  <rect class="box rt" x="438" y="640" width="244" height="132" rx="13"/>
  <text class="text name" x="474" y="668">nineclaw-{instance_id}</text>
  <text class="mono" x="462" y="694">gateway:   8642  /gateway/*</text>
  <text class="mono" x="462" y="718">webui:     8643  /webui/*</text>
  <text class="mono" x="462" y="742">dashboard: 8644  /dashboard/*</text>

  <path class="manage" d="M204 705 H252"/>
  <path class="line" d="M388 705 H438"/>

  <rect class="box rt" x="54" y="792" width="628" height="62" rx="13"/>
  <text class="text name" x="78" y="817">动态路径对应示例</text>
  <text class="mono" x="78" y="839">/traefik/nineclaw/demo/dashboard/api/status -> nineclaw-demo:8644/api/status</text>

  <text class="note" x="52" y="876">Runtime 对外统一挂在 /traefik/nineclaw/{id}/ 下，内部由 8642 / 8643 / 8644 分别承载。</text>

  <rect class="panel" x="28" y="922" width="704" height="34" rx="14"/>
  <text class="note" x="52" y="944">build profile 中的 nineclaw-runtime / nineclaw-sandbox 只用于构建镜像，不是默认常驻业务容器。</text>
</svg>
