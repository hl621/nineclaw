<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">NineClaw Sandbox Architecture</title>
  <desc id="desc">Diagram showing NineClaw Manager calling OpenSandbox to run code in a customizable sandbox image, decoupled from the main NineClaw system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef5f3"/>
    </linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f2ff"/>
      <stop offset="100%" stop-color="#d8e9ff"/>
    </linearGradient>
    <linearGradient id="sandbox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9f8f1"/>
      <stop offset="100%" stop-color="#d5f0e4"/>
    </linearGradient>
    <linearGradient id="image" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4df"/>
      <stop offset="100%" stop-color="#ffe1ad"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#1c2f3f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#496578"/>
    </marker>
    <style>
      .title { font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #132636; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b6f80; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1a3245; text-anchor: middle; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536879; text-anchor: middle; }
      .tiny { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #637687; }
      .panel { rx: 18; fill: rgba(255,255,255,0.82); stroke: #d7e1ea; stroke-width: 1.2; }
      .box { rx: 14; filter: url(#shadow); stroke-width: 1.2; }
      .line { fill: none; stroke: #496578; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #7e8f9d; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="58" class="title">NineClaw 沙箱架构</text>
  <text x="64" y="86" class="subtitle">主系统负责管理和调度，沙箱镜像承载业务代码执行所需的离线依赖。</text>

  <rect x="70" y="126" width="470" height="398" class="panel"/>
  <text x="102" y="164" class="label" text-anchor="start">NineClaw 主系统</text>
  <text x="102" y="190" class="tiny">稳定迭代：管理、配置、路由、接口、运行时生命周期</text>

  <rect x="132" y="230" width="170" height="72" fill="url(#main)" stroke="#b9d2ef" class="box"/>
  <text x="217" y="260" class="label">WebUI</text>
  <text x="217" y="284" class="small">用户配置入口</text>

  <rect x="332" y="230" width="170" height="72" fill="url(#main)" stroke="#b9d2ef" class="box"/>
  <text x="417" y="260" class="label">Manager</text>
  <text x="417" y="284" class="small">调度沙箱执行</text>

  <rect x="132" y="352" width="170" height="72" fill="url(#main)" stroke="#b9d2ef" class="box"/>
  <text x="217" y="382" class="label">Runtime</text>
  <text x="217" y="406" class="small">智能体运行</text>

  <rect x="332" y="352" width="170" height="72" fill="url(#main)" stroke="#b9d2ef" class="box"/>
  <text x="417" y="382" class="label">RAG / WebSearch</text>
  <text x="417" y="406" class="small">平台能力服务</text>

  <path d="M302 266 L326 266" class="line"/>

  <rect x="610" y="126" width="600" height="398" class="panel"/>
  <text x="642" y="164" class="label" text-anchor="start">沙箱执行环境</text>
  <text x="642" y="190" class="tiny">按项目定制：预装业务包、内部 SDK、系统工具和解析依赖</text>

  <rect x="678" y="230" width="210" height="78" fill="url(#sandbox)" stroke="#acd9c8" class="box"/>
  <text x="783" y="262" class="label">OpenSandbox</text>
  <text x="783" y="286" class="small">创建临时执行环境</text>

  <rect x="936" y="214" width="218" height="110" fill="url(#image)" stroke="#edca98" class="box"/>
  <text x="1045" y="248" class="label">nineclaw-sandbox</text>
  <text x="1045" y="274" class="small">业务方可定制镜像</text>
  <text x="1045" y="298" class="small">依赖离线预装</text>

  <rect x="678" y="366" width="476" height="80" fill="#ffffff" stroke="#d7e1ea" class="box"/>
  <text x="916" y="397" class="label">代码执行</text>
  <text x="916" y="421" class="small">Skill 脚本、提取器、项目工具代码在沙箱中运行</text>

  <path d="M502 266 C552 266 596 266 672 266" class="line"/>
  <path d="M888 266 L930 266" class="line"/>
  <path d="M1045 324 C1045 346 1010 364 964 366" class="line"/>
  <path d="M783 308 C783 342 812 356 864 366" class="line"/>

  <rect x="140" y="568" width="1000" height="72" fill="#ffffff" stroke="#d7e1ea" rx="18"/>
  <text x="190" y="596" class="tiny">解耦结果</text>
  <text x="190" y="622" class="subtitle">业务方可以按需求单独重建沙箱镜像，NineClaw 主系统继续按自己的节奏迭代。</text>
  <path d="M540 524 C560 552 584 568 616 584" class="dash"/>
  <path d="M910 524 C890 552 858 568 828 584" class="dash"/>
</svg>
