<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">NineClaw Runtime 访问泳道流程</title>
  <desc id="desc">Runtime 实例访问从用户或 Manager 进入 Traefik，再转发到实例内部 Gateway、WebUI 或 Dashboard。</desc>
  <defs>
    <marker id="arrow-runtime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.lane{fill:#fff;stroke:#d7dee8;stroke-width:1.5}.head{fill:#eef2ff}.head2{fill:#ecfeff}.head3{fill:#fff7ed}.step{fill:#fff;stroke:#cbd5e1;stroke-width:1.6}.text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#111827}.title{font-size:22px;font-weight:700}.laneText{font-size:15px;font-weight:700}.small{font-size:13px;fill:#475569}.label{font-size:14px;font-weight:700}.line{stroke:#2563eb;stroke-width:2.4;fill:none;marker-end:url(#arrow-runtime)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:5 5;marker-end:url(#arrow-runtime)}
    </style>
  </defs>
  <rect class="bg" width="760" height="560" rx="20"/>
  <text class="text title" x="34" y="38">Runtime 实例访问泳道图</text>
  <text class="text small" x="34" y="62">外部不直连容器端口，统一通过 Traefik 实例路由进入 Runtime。</text>

  <rect class="lane" x="34" y="86" width="140" height="430"/><rect class="head" x="34" y="86" width="140" height="38"/><text class="text laneText" x="104" y="110" text-anchor="middle">访问方</text>
  <rect class="lane" x="174" y="86" width="150" height="430"/><rect class="head2" x="174" y="86" width="150" height="38"/><text class="text laneText" x="249" y="110" text-anchor="middle">Traefik</text>
  <rect class="lane" x="324" y="86" width="130" height="430"/><rect class="head3" x="324" y="86" width="130" height="38"/><text class="text laneText" x="389" y="110" text-anchor="middle">Gateway</text>
  <rect class="lane" x="454" y="86" width="130" height="430"/><rect class="head3" x="454" y="86" width="130" height="38"/><text class="text laneText" x="519" y="110" text-anchor="middle">WebUI</text>
  <rect class="lane" x="584" y="86" width="142" height="430"/><rect class="head3" x="584" y="86" width="142" height="38"/><text class="text laneText" x="655" y="110" text-anchor="middle">Dashboard</text>

  <rect class="step" x="54" y="150" width="100" height="48" rx="9"/><text class="text label" x="104" y="169" text-anchor="middle">访问 Gateway</text><text class="text small" x="104" y="186" text-anchor="middle">/gateway/...</text>
  <rect class="step" x="196" y="150" width="106" height="48" rx="9"/><text class="text label" x="249" y="169" text-anchor="middle">匹配实例路由</text><text class="text small" x="249" y="186" text-anchor="middle">转到内部路径</text>
  <rect class="step" x="344" y="150" width="90" height="48" rx="9"/><text class="text label" x="389" y="169" text-anchor="middle">8642</text><text class="text small" x="389" y="186" text-anchor="middle">/status</text>
  <path class="line" d="M154 174 H196"/><path class="line" d="M302 174 H344"/>

  <rect class="step" x="54" y="268" width="100" height="48" rx="9"/><text class="text label" x="104" y="287" text-anchor="middle">进入实例 UI</text><text class="text small" x="104" y="304" text-anchor="middle">/webui/</text>
  <rect class="step" x="196" y="268" width="106" height="48" rx="9"/><text class="text label" x="249" y="287" text-anchor="middle">去除前缀</text><text class="text small" x="249" y="304" text-anchor="middle">转发 /</text>
  <rect class="step" x="474" y="268" width="90" height="48" rx="9"/><text class="text label" x="519" y="287" text-anchor="middle">8643</text><text class="text small" x="519" y="304" text-anchor="middle">实例页面</text>
  <path class="line" d="M154 292 H196"/><path class="line" d="M302 292 H474"/>

  <rect class="step" x="54" y="386" width="100" height="54" rx="9"/><text class="text label" x="104" y="406" text-anchor="middle">访问管理 API</text><text class="text small" x="104" y="424" text-anchor="middle">/dashboard/...</text>
  <rect class="step" x="196" y="386" width="106" height="54" rx="9"/><text class="text label" x="249" y="406" text-anchor="middle">注入鉴权</text><text class="text small" x="249" y="424" text-anchor="middle">Bearer Token</text>
  <rect class="step" x="606" y="386" width="98" height="54" rx="9"/><text class="text label" x="655" y="406" text-anchor="middle">8644</text><text class="text small" x="655" y="424" text-anchor="middle">Dashboard API</text>
  <path class="line" d="M154 413 H196"/><path class="line" d="M302 413 H606"/>

  <text class="text small" x="364" y="500">实例容器必须加入 qiyuan_net；否则 Traefik 路由存在也无法转发。</text>
</svg>
