<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
  <title id="title">NineClaw Deploy 交付泳道流程</title>
  <desc id="desc">Deploy 从构建侧收集镜像和配置，形成部署包，用户执行部署包后启动运行时系统。</desc>
  <defs>
    <marker id="arrow-deploy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.lane{fill:#fff;stroke:#d7dee8;stroke-width:1.5}.head{fill:#eef2ff}.head2{fill:#fff7ed}.head3{fill:#f0fdf4}.head4{fill:#ecfeff}.step{fill:#fff;stroke:#cbd5e1;stroke-width:1.6}.text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#111827}.title{font-size:22px;font-weight:700}.laneText{font-size:15px;font-weight:700}.small{font-size:13px;fill:#475569}.label{font-size:14px;font-weight:700}.line{stroke:#2563eb;stroke-width:2.4;fill:none;marker-end:url(#arrow-deploy)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:5 5;marker-end:url(#arrow-deploy)}
    </style>
  </defs>
  <rect class="bg" width="760" height="590" rx="20"/>
  <text class="text title" x="34" y="38">Deploy 交付与部署泳道图</text>
  <text class="text small" x="34" y="62">Deploy 只负责交付和启动，系统运行后的业务流量不经过 Deploy。</text>

  <rect class="lane" x="34" y="86" width="150" height="460"/><rect class="head" x="34" y="86" width="150" height="38"/><text class="text laneText" x="109" y="110" text-anchor="middle">各项目</text>
  <rect class="lane" x="184" y="86" width="150" height="460"/><rect class="head2" x="184" y="86" width="150" height="38"/><text class="text laneText" x="259" y="110" text-anchor="middle">Deploy</text>
  <rect class="lane" x="334" y="86" width="142" height="460"/><rect class="head3" x="334" y="86" width="142" height="38"/><text class="text laneText" x="405" y="110" text-anchor="middle">部署包</text>
  <rect class="lane" x="476" y="86" width="126" height="460"/><rect class="head4" x="476" y="86" width="126" height="38"/><text class="text laneText" x="539" y="110" text-anchor="middle">用户机器</text>
  <rect class="lane" x="602" y="86" width="124" height="460"/><rect class="head3" x="602" y="86" width="124" height="38"/><text class="text laneText" x="664" y="110" text-anchor="middle">运行时系统</text>

  <rect class="step" x="54" y="150" width="110" height="56" rx="9"/><text class="text label" x="109" y="171" text-anchor="middle">产出镜像</text><text class="text small" x="109" y="189" text-anchor="middle">WebUI/Docs</text><text class="text small" x="109" y="203" text-anchor="middle">Manager/Runtime</text>
  <rect class="step" x="204" y="150" width="110" height="56" rx="9"/><text class="text label" x="259" y="171" text-anchor="middle">收集制品</text><text class="text small" x="259" y="189" text-anchor="middle">镜像/compose/env</text>
  <path class="line" d="M164 178 H204"/>

  <rect class="step" x="204" y="250" width="110" height="54" rx="9"/><text class="text label" x="259" y="270" text-anchor="middle">生成部署包</text><text class="text small" x="259" y="288" text-anchor="middle">docker_images</text>
  <rect class="step" x="354" y="250" width="102" height="54" rx="9"/><text class="text label" x="405" y="270" text-anchor="middle">离线包</text><text class="text small" x="405" y="288" text-anchor="middle">deploy.sh 等</text>
  <path class="line" d="M314 277 H354"/>

  <rect class="step" x="496" y="250" width="86" height="54" rx="9"/><text class="text label" x="539" y="270" text-anchor="middle">执行脚本</text><text class="text small" x="539" y="288" text-anchor="middle">配置 .env</text>
  <path class="line" d="M456 277 H496"/>

  <rect class="step" x="496" y="354" width="86" height="58" rx="9"/><text class="text label" x="539" y="374" text-anchor="middle">导入镜像</text><text class="text small" x="539" y="392" text-anchor="middle">创建网络</text><text class="text small" x="539" y="406" text-anchor="middle">启动 Compose</text>
  <rect class="step" x="620" y="354" width="88" height="58" rx="9"/><text class="text label" x="664" y="374" text-anchor="middle">服务运行</text><text class="text small" x="664" y="392" text-anchor="middle">Traefik/WebUI</text><text class="text small" x="664" y="406" text-anchor="middle">Manager 等</text>
  <path class="line" d="M582 383 H620"/>

  <rect class="step" x="620" y="470" width="88" height="42" rx="9"/><text class="text label" x="664" y="496" text-anchor="middle">承载访问</text>
  <path class="dash" d="M259 304 C259 510 520 510 620 491"/>
  <text class="text small" x="330" y="524">Deploy 不参与运行时业务流量</text>
</svg>
