<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">NineClaw Product Architecture</title>
  <desc id="desc">Layered NineClaw product architecture diagram with entry, platform capability, runtime integration, and deployment infrastructure layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#edf5f2"/>
    </linearGradient>
    <linearGradient id="entry" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f8fb"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f2ff"/>
      <stop offset="100%" stop-color="#d8e9ff"/>
    </linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f8f1"/>
      <stop offset="100%" stop-color="#d5f0e4"/>
    </linearGradient>
    <linearGradient id="infra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4df"/>
      <stop offset="100%" stop-color="#ffe1ad"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#1c2f3f" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#496578"/>
    </marker>
    <style>
      .title { font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #132636; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b6f80; }
      .layerTitle { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1a3245; }
      .label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1a3245; text-anchor: middle; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536879; text-anchor: middle; }
      .tiny { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #637687; }
      .panel { rx: 20; fill: rgba(255,255,255,0.82); stroke: #d7e1ea; stroke-width: 1.2; }
      .box { rx: 13; filter: url(#shadow); stroke-width: 1.2; }
      .line { fill: none; stroke: #496578; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #7e8f9d; stroke-width: 1.7; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="920" fill="url(#bg)"/>
  <text x="64" y="58" class="title">NineClaw 产品架构</text>
  <text x="64" y="86" class="subtitle">从用户入口到平台能力，再到运行时、开源组件和离线部署的分层关系。</text>

  <rect x="64" y="120" width="1152" height="124" class="panel"/>
  <text x="94" y="156" class="layerTitle">用户与接入入口</text>
  <rect x="220" y="154" width="180" height="58" fill="url(#entry)" stroke="#d2dde7" class="box"/>
  <text x="310" y="179" class="label">WebUI</text>
  <text x="310" y="199" class="small">统一管理界面</text>
  <rect x="430" y="154" width="180" height="58" fill="url(#entry)" stroke="#d2dde7" class="box"/>
  <text x="520" y="179" class="label">API</text>
  <text x="520" y="199" class="small">服务二开入口</text>
  <rect x="640" y="154" width="180" height="58" fill="url(#entry)" stroke="#d2dde7" class="box"/>
  <text x="730" y="179" class="label">SDK</text>
  <text x="730" y="199" class="small">业务系统集成</text>
  <rect x="850" y="154" width="180" height="58" fill="url(#entry)" stroke="#d2dde7" class="box"/>
  <text x="940" y="179" class="label">Docs</text>
  <text x="940" y="199" class="small">文档与接口</text>

  <path d="M640 244 L640 276" class="line"/>

  <rect x="64" y="276" width="1152" height="268" class="panel"/>
  <text x="94" y="312" class="layerTitle">平台能力层</text>
  <rect x="160" y="340" width="210" height="72" fill="url(#platform)" stroke="#b9d2ef" class="box"/>
  <text x="265" y="370" class="label">实例管理</text>
  <text x="265" y="394" class="small">创建、启停实例</text>
  <rect x="400" y="340" width="210" height="72" fill="url(#platform)" stroke="#b9d2ef" class="box"/>
  <text x="505" y="370" class="label">模型管理</text>
  <text x="505" y="394" class="small">供应商与密钥</text>
  <rect x="640" y="340" width="210" height="72" fill="url(#platform)" stroke="#b9d2ef" class="box"/>
  <text x="745" y="370" class="label">知识库</text>
  <text x="745" y="394" class="small">RAG 召回与重排</text>
  <rect x="280" y="432" width="210" height="72" fill="url(#platform)" stroke="#b9d2ef" class="box"/>
  <text x="385" y="462" class="label">信源管理</text>
  <text x="385" y="486" class="small">搜索源与提取器</text>
  <rect x="520" y="432" width="210" height="72" fill="url(#platform)" stroke="#b9d2ef" class="box"/>
  <text x="625" y="462" class="label">Skill / MCP</text>
  <text x="625" y="486" class="small">工具注册部署</text>
  <rect x="760" y="432" width="210" height="72" fill="url(#platform)" stroke="#b9d2ef" class="box"/>
  <text x="865" y="462" class="label">系统部署</text>
  <text x="865" y="486" class="small">镜像与离线交付</text>
  <rect x="386" y="518" width="508" height="28" fill="#f3f8fc" stroke="#d2dee8" rx="14"/>
  <text x="640" y="537" class="small">NineClaw-Manager 作为统一管理与适配层</text>

  <path d="M640 544 L640 576" class="line"/>

  <rect x="64" y="576" width="1152" height="180" class="panel"/>
  <text x="94" y="612" class="layerTitle">运行与集成层</text>
  <rect x="160" y="640" width="230" height="72" fill="url(#runtime)" stroke="#acd9c8" class="box"/>
  <text x="275" y="670" class="label">NineClaw-Runtime</text>
  <text x="275" y="694" class="small">Agent 与工具调用</text>
  <rect x="420" y="640" width="230" height="72" fill="url(#runtime)" stroke="#acd9c8" class="box"/>
  <text x="535" y="670" class="label">QY-RAG</text>
  <text x="535" y="694" class="small">解析、召回、重排</text>
  <rect x="680" y="640" width="230" height="72" fill="url(#runtime)" stroke="#acd9c8" class="box"/>
  <text x="795" y="670" class="label">NineClaw-WebSearch</text>
  <text x="795" y="694" class="small">搜索、抽取、融合</text>
  <rect x="940" y="640" width="230" height="72" fill="url(#runtime)" stroke="#acd9c8" class="box"/>
  <text x="1055" y="670" class="label">外部系统</text>
  <text x="1055" y="694" class="small">接口与已有资产</text>

  <path d="M275 756 L275 788" class="dash"/>
  <path d="M535 756 L535 788" class="dash"/>
  <path d="M795 756 L795 788" class="dash"/>
  <path d="M1055 756 L1055 788" class="dash"/>

  <rect x="64" y="788" width="1152" height="92" class="panel"/>
  <text x="94" y="824" class="layerTitle">部署与基础组件层</text>
  <rect x="250" y="824" width="180" height="42" fill="url(#infra)" stroke="#edca98" rx="12"/>
  <text x="340" y="851" class="small">NineClaw-Deploy</text>
  <rect x="470" y="824" width="180" height="42" fill="url(#infra)" stroke="#edca98" rx="12"/>
  <text x="560" y="851" class="small">Traefik</text>
  <rect x="690" y="824" width="180" height="42" fill="url(#infra)" stroke="#edca98" rx="12"/>
  <text x="780" y="851" class="small">Docker</text>
  <rect x="910" y="824" width="180" height="42" fill="url(#infra)" stroke="#edca98" rx="12"/>
  <text x="1000" y="851" class="small">存储与数据库</text>

  <text x="740" y="904" class="tiny">核心思路：开放集成、标准接口、可替换组件、离线交付。</text>
</svg>
